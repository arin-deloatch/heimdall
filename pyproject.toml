[project]
name = "quality-enforcer-mcp"
version = "0.1.0"
description = "MCP server for cross-repo code quality enforcement and synchronization"
readme = "README.md"
authors = [
    { name = "arin-deloatch", email = "arindeloatch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "gitpython>=3.1.46",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
]

[project.scripts]
quality-enforcer-mcp = "quality_enforcer_mcp:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring external repos",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = ["S101"]  # Allow assert in tests

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportAttributeAccessIssue = false
